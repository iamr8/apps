name: Release

# Releases the apps CLI.
#
# Triggered when develop is merged into main (main is the release branch), or manually via
# workflow_dispatch. The `check` job reads the VERSION file and compares it against the highest
# version already published as a GitHub release: only if VERSION is strictly newer does the pipeline
# build the AOT binaries, tag the commit, and publish the release. If VERSION is lower than or equal
# to the highest release, the run FAILS — the convention is to include the VERSION bump in the
# develop -> main release PR, so an un-bumped merge to main is a mistake worth surfacing loudly.
#
# There is no tag trigger: the tag is created by the release job as the release anchor, it is not what
# starts the pipeline. The single source of truth for the version is the VERSION file.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check version is newer
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Compare VERSION against the highest published release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [ -z "$VERSION" ]; then echo "::error::VERSION file is empty"; exit 1; fi

          LATEST=$(gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | sed 's/^v//' | sort -V | tail -1 || true)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION file: $VERSION; highest release: ${LATEST:-<none>}"

          if [ -z "$LATEST" ]; then
            echo "First release: $VERSION"
          elif [ "$VERSION" = "$LATEST" ]; then
            echo "::error title=Release failed::Version $VERSION is already released. Bump VERSION to release."
            exit 1
          else
            TOP=$(printf '%s\n%s\n' "$VERSION" "$LATEST" | sort -V | tail -1)
            if [ "$TOP" != "$VERSION" ]; then
              echo "::error title=Release failed::Version $VERSION is not newer than the highest release ($LATEST)."
              exit 1
            fi
            echo "Releasing $VERSION (previous highest: $LATEST)"
          fi

  test:
    name: Build & test
    needs: check
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  build:
    name: Package
    needs: test
    runs-on: macos-15
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # AOT publish with -r is inherently self-contained, and the csproj reads the version from the
      # VERSION file at build time, so neither --self-contained nor -p:Version is needed. Tests and
      # warnings-as-errors already ran once in the `test` job, so this job only produces the binary.
      - name: Publish binary
        run: |
          dotnet publish apps/apps.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -o dist

      - name: Archive binary
        run: |
          cd dist
          tar -czf ../apps-${{ matrix.rid }}.tar.gz apps

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apps-${{ matrix.rid }}
          path: apps-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: [ check, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the git tag and GitHub release
    environment:
      name: github-release
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Tag and create GitHub release
        env:
          TAG: v${{ needs.check.outputs.version }}
          VERSION: ${{ needs.check.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t ASSETS < <(find artifacts -name '*.tar.gz' | sort)
          echo "Release assets: ${ASSETS[*]}"

          # Idempotent: tolerate an existing tag/release so a re-run after a later-stage failure recovers.
          git tag "$TAG" || echo "tag $TAG already exists locally"
          git push origin "$TAG" || echo "tag $TAG already on origin"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" --title "v$VERSION" --generate-notes "${ASSETS[@]}"
          fi
