name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
          - os: macos-13
            rid: osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Publish binary
        run: VERSION=${{ steps.version.outputs.version }} ./publish.sh ${{ matrix.rid }}

      - name: Archive binary
        run: |
          cd dist
          tar -czf ../apps-${{ matrix.rid }}.tar.gz apps

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apps-${{ matrix.rid }}
          path: apps-${{ matrix.rid }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*.tar.gz
