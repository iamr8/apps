name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.4)'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]

    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish binary
        run: |
          dotnet publish apps/apps.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            -p:Version=${{ steps.version.outputs.version }} \
            -o dist

      - name: Archive binary
        run: |
          cd dist
          tar -czf ../apps-${{ matrix.rid }}.tar.gz apps

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: apps-${{ matrix.rid }}
          path: apps-${{ matrix.rid }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Determine previous tag
        id: prev
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          PREV=$(git tag --sort=-v:refname | grep -E '^v' | grep -v "^${TAG}$" | head -1)
          if [ -z "$PREV" ]; then
            PREV=$(git rev-list --max-parents=0 HEAD | head -1)
          fi
          echo "tag=${PREV}" >> "$GITHUB_OUTPUT"

      - name: Generate release body
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          PREV="${{ steps.prev.outputs.tag }}"
          REPO="${{ github.server_url }}/${{ github.repository }}"
          COMPARE="${REPO}/compare/${PREV}...${TAG}"

          echo "## What's Changed" > release-notes.md
          echo "" >> release-notes.md
          echo "**Full diff:** [${PREV}...${TAG}](${COMPARE})" >> release-notes.md
          echo "" >> release-notes.md
          git log "${PREV}..${TAG}" --pretty=format:"- %s ([%h](${REPO}/commit/%H))" --reverse | grep -v "chore: bump version" >> release-notes.md || true
          echo "" >> release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: artifacts/**/*.tar.gz
