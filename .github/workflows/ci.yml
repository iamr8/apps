name: CI

# Runs on every push to develop (the integration branch all PRs land on) and on PRs targeting either
# develop or main. main receives releases via a develop -> main merge, so the release pipeline
# (release.yml) re-runs build & test there; this workflow keeps the day-to-day feedback loop on develop.
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release /warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

  aot-publish:
    name: AOT Publish Smoke Test
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish AOT binary
        run: dotnet publish apps/apps.csproj -c Release -r osx-arm64 --self-contained

      - name: Verify binary runs
        run: ./apps/bin/Release/net10.0/osx-arm64/publish/apps --help
